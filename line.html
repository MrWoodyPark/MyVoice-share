<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>같은 대사, 다른 목소리</title><link rel="stylesheet" href="style.css"><script defer src="line.js"></script></head><body><main><header><img src="icon.png" width="52" height="52" alt=""><h1>같은 대사, 다른 목소리</h1></header><section class="intro"><h2 id="line"></h2><p id="status" role="status">초대장을 여는 중입니다.</p></section><section class="card"><label>받은 퀴즈 열기 <input id="quiz-file" type="file" accept=".html,text/html"></label><div id="quiz"></div></section><section id="studio" hidden><div class="card"><h3>초대한 사람</h3><div id="host"></div></div><div class="card"><h3>답한 사람</h3><div id="guest">같은 대사를 읽어 보세요.</div></div><p class="caption">색이 찬 부분은 유성음, 빈 부분은 쉼입니다. 자막 진행은 유성음의 누적 시간을 기준으로 추정합니다.</p><button id="record">내 목소리로 답하기</button><p><button id="play" hidden>두 리듬 함께 보기</button></p><audio id="audio" controls hidden></audio><p><button id="send" hidden>두 사람의 결과 보내기</button></p><p><label>친구에게 낼 다음 대사 <input id="next-line" maxlength="120"></label> <button id="next-send">다음 대사 보내기</button></p><p>마이크 소리는 이 브라우저에서 처리합니다. 답장 링크에는 대사와 두 사람의 리듬이 담깁니다.</p></section></main></body></html>
